kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: clusternet:agent:admin
  namespace: clusternet-system
rules:
  # Leader election: agent uses LeaseLock (CoordinationV1) to elect a leader.
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    verbs: [ "get", "create", "update" ]
  # Leader election events (created by client-go on leader transitions).
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "create", "patch" ]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clusternet:agent:admin
  namespace: clusternet-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clusternet:agent:admin
subjects:
  - kind: ServiceAccount
    name: clusternet-agent
    namespace: clusternet-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusternet:agent:admin
rules:
  - apiGroups: [ "" ]
    resources: [ "pods", "nodes" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: [ "endpointslices" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "multicluster.x-k8s.io" ]
    resources: [ "serviceexports" ]
    verbs: [ "get", "list", "watch", "update", "patch" ]
  # API discovery — needed so the agent can discover API groups on the child cluster.
  - nonResourceURLs: [ "/api", "/api/*", "/apis", "/apis/*", "/healthz", "/readyz", "/livez" ]
    verbs: [ "get" ]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusternet:agent:admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusternet:agent:admin
subjects:
  - kind: ServiceAccount
    name: clusternet-agent
    namespace: clusternet-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusternet:app:deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: clusternet-app-deployer
    namespace: clusternet-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusternet:agent:deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: clusternet-agent
    namespace: clusternet-system
